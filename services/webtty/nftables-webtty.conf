#!/usr/sbin/nft -f
# webtty ingress gate on claude-dev. ttyd binds eth0 (10.10.10.10) because that is this box's only
# leg, which would otherwise offer a root-capable shell to every host on the agent subnet. Only the
# web box's isolated leg may reach it -- everything else on 10.10.10.0/24 is dropped.
#
# This is deliberately TIGHTER than mcpgate, which allows the whole agent subnet: an MCP port
# exposes data, port 7681 exposes a shell with the ops SSH key, the GitHub push key and the Claude
# credentials behind it.
#
# Allowed sources for 7681:
#   10.10.10.12   the Caddy/Authelia web box, isolated leg (the only legitimate client)
#   loopback      harmless: ttyd binds eth0 today, so nothing is listening there -- the rule only
#                 matters if the bind is ever widened to 0.0.0.0
#
# Managed by moprox-tooling/services/webtty -- do NOT hand-edit on the box.
# Reload idempotently with: nft -f /etc/nftables-webtty.conf

add table inet webtty
delete table inet webtty
table inet webtty {
	chain input {
		type filter hook input priority -10; policy accept;
		tcp dport 7681 iifname "lo" accept
		tcp dport 7681 ip saddr 10.10.10.12 accept
		tcp dport 7681 drop
	}
}
