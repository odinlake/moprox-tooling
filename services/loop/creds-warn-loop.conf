# Drop-in for moprox-creds-warn.service ON CLAUDE-LOOP ONLY.
#
#   install -m644 services/loop/creds-warn-loop.conf \
#     /etc/systemd/system/moprox-creds-warn.service.d/loop.conf
#
# The base unit's remedy names the moprox-dev sessions, which do not exist on this box, so an
# unmodified install would have told the operator to fix the wrong machine. The message is the
# whole product of a warning timer, so it is worth a drop-in.
#
# Why this box needs the timer at all: claude-loop went dark for 38 hours on 2026-09-04 when its
# refresh token hit its four-week ceiling. The warning timer existed since 2026-07-25 and covered
# only claude-dev.
[Service]
ExecStart=
ExecStart=/usr/local/bin/moprox-creds-check --warn --days 5 --handle loop --remedy "claude-loop runs on the same Max account as claude-dev. Either copy ~/.claude/.credentials.json from claude-dev to this box, or /login on it directly (pct enter 114). The loop agents SKIP while credentials are dead rather than taking strikes, so nothing needs resetting afterwards: they resume on the next timer tick by themselves."
