#!/usr/sbin/nft -f
# yoto-web ingress gate on claude-dev. The picker binds 0.0.0.0:8030 and can start the children's
# Yoto, so only the Caddy/Authelia web box's isolated leg (10.10.10.12), Home Assistant (10.10.10.7,
# which pushes play events) and loopback may reach it;
# everything else on 10.10.10.0/24 is dropped. Same shape as nftables-webtty.conf.
#
# Managed by moprox-tooling/services/yoto/web -- do NOT hand-edit on the box.
# Reload idempotently with: nft -f /etc/nftables-yotoweb.conf

add table inet yotoweb
delete table inet yotoweb
table inet yotoweb {
	chain input {
		type filter hook input priority -10; policy accept;
		tcp dport 8030 iifname "lo" accept
		tcp dport 8030 ip saddr 10.10.10.12 accept
		tcp dport 8030 ip saddr 10.10.10.7 accept     # Home Assistant: POST /api/playlog only (server.py enforces)
		tcp dport 8030 drop
	}
}
