# Drop-in for the "moprox coach" remote session: moprox-dev@coach.service.
#
#   mkdir -p /etc/systemd/system/moprox-dev@coach.service.d
#   install -m644 services/sessions/moprox-dev@coach.conf \
#     /etc/systemd/system/moprox-dev@coach.service.d/override.conf
#
# Coach reuses the moprox-dev@ template rather than getting a unit of its own, because that template
# carries three hard-won ExecStartPre gates (folder trust, credential expiry, egress probe) and a
# restart policy that took two outages to arrive at. A copy would drift from it. The template is
# agent-agnostic in everything except its name; only the two lines below differ per agent, and
# moprox-dev-launch supplies the rest from the instance id.
#
# WorkingDirectory is the whole trick: Claude Code auto-loads CLAUDE.md from the directory it starts
# in, so starting here IS what makes this session coach rather than a generic session. Its persona,
# @training-context.md, @part_c_gaps.md and its durable @coach-memory.md all come with it.
#
# One consequence to know: this directory already holds 255 transcripts from coach's one-shot
# `claude -p` runs, which share the project dir. That is harmless (the launcher resumes a recorded
# session id, never "the latest"), and it is exactly why `--continue` must never be used here.
[Unit]
Description=Claude Code remote session "moprox coach"

[Service]
WorkingDirectory=/home/mikael/projects/private-data/agents/coach
