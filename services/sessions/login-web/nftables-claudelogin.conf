#!/usr/sbin/nft -f
# claude-login ingress gate on claude-dev. The broker binds 0.0.0.0:8034 and decides which Claude
# account every agent in the estate runs on, so only the Caddy/Authelia web box's isolated leg
# (10.10.10.12) and loopback may reach it; Authelia (one_factor, even on trusted networks, like /tty)
# is the user-facing boundary.
#
# Managed by moprox-tooling/services/sessions/login-web -- do NOT hand-edit on the box.
add table inet claudelogin
delete table inet claudelogin
table inet claudelogin {
	chain input {
		type filter hook input priority -10; policy accept;
		tcp dport 8034 iifname "lo" accept
		tcp dport 8034 ip saddr 10.10.10.12 accept
		tcp dport 8034 drop
	}
}
