# Drop-in for the "moprox BARD" remote session: moprox-dev@bard.service.
#
#   mkdir -p /etc/systemd/system/moprox-dev@bard.service.d
#   install -m644 services/sessions/moprox-dev@bard.conf \
#     /etc/systemd/system/moprox-dev@bard.service.d/override.conf
#
# Same reasoning as the coach drop-in: reuse the moprox-dev@ template rather than adding a unit, so
# the three ExecStartPre gates (folder trust, credential expiry, egress probe) and the restart policy
# stay in ONE place. Only the two lines below differ per agent.
#
# WorkingDirectory is what makes this session bard: Claude Code auto-loads CLAUDE.md from the
# directory it starts in, so its persona, its reflex-first behaviour and its knowledge of the Yoto
# traps all arrive with it.
[Unit]
Description=Claude Code remote session "moprox BARD"

[Service]
WorkingDirectory=/home/mikael/projects/private-data/agents/bard
